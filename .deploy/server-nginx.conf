# Destiny MCP production Nginx server block.
#
# This file is intended to be included by an Nginx container that is attached
# to the same Docker network as `destiny-mcp` and `destiny-webui`.
# Only Nginx should publish public ports; MCP/WebUI stay private on Docker DNS.

limit_req_zone $binary_remote_addr zone=destiny_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=destiny_mcp:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=destiny_web:10m rate=20r/s;

server {
  listen 80;
  server_name sunsetshimmer.mindtype.cn;

  client_max_body_size 10m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name sunsetshimmer.mindtype.cn;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $destiny_mcp destiny-mcp:8001;
  set $destiny_webui destiny-webui:8000;
  set $gamecast_control gamecast-control:8787;
  set $gamecast_livekit gamecast-livekit:7880;

  client_max_body_size 10m;

  ssl_certificate /etc/letsencrypt/live/sunsetshimmer.mindtype.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sunsetshimmer.mindtype.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location ~* ^/(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.env|\.git) {
    access_log off;
    return 404;
  }

  location /auth/bungie {
    limit_req zone=destiny_auth burst=10 nodelay;
    proxy_pass http://$destiny_webui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /auth/callback {
    limit_req zone=destiny_auth burst=10 nodelay;
    proxy_pass http://$destiny_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /auth {
    limit_req zone=destiny_auth burst=10 nodelay;
    proxy_pass http://$destiny_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /auth/me {
    limit_req zone=destiny_auth burst=10 nodelay;
    proxy_pass http://$destiny_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /mcp {
    limit_req zone=destiny_mcp burst=60 nodelay;
    proxy_pass http://$destiny_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_cache off;
  }

  location = /gamecast {
    return 308 /gamecast/;
  }

  location ^~ /gamecast/livekit/ {
    rewrite ^/gamecast/livekit/(.*)$ /$1 break;
    proxy_pass http://$gamecast_livekit;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  location ^~ /gamecast/ {
    rewrite ^/gamecast/(.*)$ /$1 break;
    proxy_pass http://$gamecast_control;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  location ^~ /static/ {
    limit_req zone=destiny_web burst=40 nodelay;
    proxy_pass http://$destiny_webui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location ^~ /manifest.json {
    limit_req zone=destiny_web burst=20 nodelay;
    proxy_pass http://$destiny_webui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=destiny_web burst=40 nodelay;
    proxy_pass http://$destiny_webui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_cache off;
  }
}
# ── sunsetshimmer.top (legacy, keep for backward compat) ────────
server {
  listen 80;
  server_name sunsetshimmer.top;
  return 301 https://sunsetshimmer.mindtype.cn$request_uri;
}

# ── Original site (Project1) ────────────────────────────────────
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 5m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /bdunion.txt {
    alias /usr/share/nginx/verification/bdunion.txt;
    add_header Cache-Control "no-store";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend backend:8080;
    proxy_pass http://$upstream_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /admin/ {
    alias /usr/share/nginx/admin/;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /admin/index.html;
  }

  location ^~ /uploads/ {
    alias /usr/share/nginx/uploads/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    return 302 /home;
  }

  location = /home {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
