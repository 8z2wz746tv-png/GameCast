services:
  control-server:
    build:
      context: .
      dockerfile: infra/server-runtime.Dockerfile
    container_name: gamecast-control
    env_file: .env
    environment:
      # The reverse proxy sits on a Docker bridge network (172.16.0.0/12). Without this the rate
      # limiter keys every client to the proxy address and they all share one bucket.
      TRUST_PROXY: "${TRUST_PROXY:-172.16.0.0/12}"
    depends_on:
      - livekit
      - coturn
    networks:
      - default
      - project1
    mem_limit: 256m
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: gamecast-livekit
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    networks:
      - default
      - project1
    mem_limit: 384m
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3
    container_name: gamecast-coturn
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=sunsetshimmer.mindtype.cn
      # Replace both addresses for each deployment: public-ip/private-container-ip.
      # The mapping is required when coturn runs behind Docker bridge NAT.
      - --external-ip=${TURN_EXTERNAL_IP:-203.0.113.10/172.19.0.3}
      - --listening-ip=172.19.0.3
      - --relay-ip=172.19.0.3
      - --listening-port=3478
      - --alt-listening-port=443
      - --tls-listening-port=5349
      # The coturn image runs as nobody:nogroup. Mount a dedicated copy of
      # the certificate files so restrictive Let's Encrypt directory modes do
      # not prevent the TLS listener from starting.
      - --cert=/etc/coturn-certs/fullchain.pem
      - --pkey=/etc/coturn-certs/privkey.pem
      - --min-port=49160
      - --max-port=49200
      # Bound how much of the relay pool a single credential can hold, so one leaked or brute-forced
      # TURN credential cannot starve every other session.
      - --user-quota=8
      - --total-quota=200
      - --log-file=stdout
    volumes:
      - ./coturn-certs:/etc/coturn-certs:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "443:443/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    networks:
      - default
    mem_limit: 128m
    restart: unless-stopped

networks:
  project1:
    external: true
    name: project1_default
